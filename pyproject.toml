[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amagama"
description = "A web translation memory server"
readme = "README.rst"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dynamic = ["version"]
authors = [
    { name = "Translate" },
]
urls = { Homepage = "http://amagama.translatehouse.org", Source = "https://github.com/translate/amagama" }

dependencies = [
    "blinker>=1.6",
    "Flask>=3.0",
    "Flask-Caching>=2.0",
    # Lookups' licence filter
    "license-expression>=30",
    "psycopg2>=2.9",
    "pycountry>=22.3",
    "translate-toolkit>=3.0",
    # The standard library has zstd from Python 3.14.
    'zstandard>=0.22; python_version < "3.14"',
]

[project.optional-dependencies]
recommended = [
    # For running the "amagama" dev server without a separate WSGI server
    "cheroot",
    # For better performance
    "python-Levenshtein>=0.10.2,!=0.11.0",
    # For management commands
    "click",
    "lz4",
    # discover_sources crowdin reads crowdin.yml
    "PyYAML>=6",
    "spdx-license-list>=3.29",
    # Monolingual sources: PHP and Fluent readers
    "translate-toolkit[fluent,php]>=3.0",
]
dev = [
    "amagama[recommended]",
    "numpy",
    "prek",
    "ruff",
    "Sphinx>=1.1",
    "pytest",
    "pytest-cov",
    "pytest-postgresql>=6",
    # Tests the zstd fallback for Python < 3.14 on every version.
    "zstandard>=0.22",
]

[project.scripts]
amagama = "amagama.devserver:main"
amagama-manage = "amagama.cli:manage"

[tool.setuptools]
packages = ["amagama", "amagama.tests", "amagama.updater", "amagama.views"]

[tool.setuptools.package-data]
amagama = ["templates/*", "static/**/*", "po/sources/*", "po/web/*"]
"amagama.updater" = ["sources.toml", "weblate-*.toml", "linguas-*.toml"]

[tool.setuptools.dynamic]
version = { attr = "amagama.__version__" }

[tool.coverage.run]
source = ["amagama"]
omit = ["amagama/tests/*"]

[tool.coverage.report]
fail_under = 95

[tool.ruff]
target-version = "py311"
# Fits the existing long lines (mostly SQL) without reformatting the code.
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.codespell]
# A name in AUTHORS.md (Alaa Abd el Fattah).
ignore-words-list = "abd"
