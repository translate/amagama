name: Test

on:
  push:
    branches: [main]
  pull_request:
  # Discover sources' pull requests start their tests this way.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Install Subversion
        run: command -v svn || (sudo apt-get update && sudo apt-get install -y subversion)
      - name: pytest
        run: |
          pg_ctl=(/usr/lib/postgresql/*/bin/pg_ctl)
          pytest --postgresql-exec="${pg_ctl[-1]}" --cov --cov-report=xml
      - name: Coverage summary
        if: matrix.python == '3.14'
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        if: matrix.python == '3.14'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip wheel --no-deps -w dist .
      - name: Wheel has the web UI files
        run: |
          python -m zipfile -l dist/amagama-*.whl > files.txt
          for f in templates/translate.html static/js/amagama.js static/css/amagama.css; do
            grep -q "amagama/$f" files.txt || { echo "::error::$f missing from the wheel"; exit 1; }
          done

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install Sphinx
      - run: make docs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install prek
      - run: prek run --all-files --show-diff-on-failure

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start PostgreSQL and amaGama
        run: docker compose up -d --build --wait postgres app
      - name: Initialise a source language and query the API
        run: |
          docker compose exec -T app amagama-manage initdb -s en
          docker compose restart app
          for _ in $(seq 1 30); do curl -fs http://localhost:8888/api/v1/languages/ && break; sleep 2; done
          curl -fs http://localhost:8888/api/v1/languages/ | grep -q '"en"'
      - name: Logs
        if: failure()
        run: docker compose logs

  checks:
    needs: [test, package, docs, lint, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
