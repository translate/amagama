name: Fuzz pull requests

on:
  pull_request:

permissions:
  contents: read
  # The latest corpus and main's build come from other runs' artifacts.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Build the fuzz targets
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      # Fails only on crashes main's build doesn't have.
      - name: Fuzz the targets the change reaches
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: address
