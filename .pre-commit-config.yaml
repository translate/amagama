# For prek (https://github.com/j178/prek) or pre-commit (https://pre-commit.com).
# Install once per checkout with `prek install`.

default_install_hook_types: [pre-commit, commit-msg]

# Vendored third-party files stay byte-for-byte as upstream ships them.
exclude: ^amagama/static/(css/bootstrap|fonts/|js/vendor/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # Generated sources files: reviewed text, not binaries.
        exclude: ^amagama/updater/weblate-.*\.toml$
      - id: check-ast
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check

  - repo: local
    hooks:
      - id: check-copyright-header
        name: check the copyright header (.license.header.txt)
        entry: devsupport/check-copyright-header.sh
        language: system
        files: (\.py$|^bin/)

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        # Generated from Weblate: project and file names, not prose.
        exclude: ^amagama/updater/weblate-.*\.toml$

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
