# Redirect everything to https
server {
	server_name amagama-live.translatehouse.org;
	listen 80;
	listen [::]:80 ipv6only=on;

	return 301 https://$server_name$request_uri;
}

# Backwards compatibility
# Redirect amagama.locamotion.org to amagama-live.translatehouse.org

server {
	server_name amagama.locamotion.org;
	listen 80;
	listen [::]:80;

	#access_log /var/www/sites/amagama_fw/logs/nginx.access.log;
	#error_log /var/www/sites/amagama_fw/logs/nginx.error.log;
	access_log /var/www/sites/amagama/logs/nginx.access.log;
	error_log /var/www/sites/amagama/logs/nginx.error.log;
	location / {
		return 301 https://amagama-live.translatehouse.org;
	}

	location /tmserver {
		include uwsgi_params;
		#uwsgi_pass unix:/var/www/sites/amagama_fw/uwsgi.sock;
		uwsgi_pass unix:/run/amagama/uwsgi.socket;
	#	rewrite ^/tmserver/(.*)$ https://amagama-live.translatehouse.org/api/v1/$1 permanent;
	}
}

server {
	server_name amagama-live.translatehouse.org;
	listen 443 ssl;
	listen [::]:443 ssl default_server;
	http2 on;

	charset utf-8;
	root /var/www/sites/amagama;
	#access_log /var/www/sites/amagama_fw/logs/live-nginx.access.log;
	#error_log /var/www/sites/amagama_fw/logs/live-nginx.error.log;
	access_log /var/www/sites/amagama/logs/live-nginx.access.log;
	error_log /var/www/sites/amagama/logs/live-nginx.error.log;
	#index index.html;

	ssl_certificate /etc/letsencrypt/live/amagama-live.translatehouse.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/amagama-live.translatehouse.org/privkey.pem;
	ssl_session_timeout 5m;

	ssl_trusted_certificate /etc/letsencrypt/live/amagama-live.translatehouse.org/chain.pem;
	ssl_stapling on;
	ssl_stapling_verify on;


	ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
	ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:ECDHE-RSA-AES128-GCM-SHA256:AES256+EECDH:DHE-RSA-AES128-GCM-SHA256:AES256+EDH:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA:ECDHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA256:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA:ECDHE-RSA-DES-CBC3-SHA:EDH-RSA-DES-CBC3-SHA:AES256-GCM-SHA384:AES128-GCM-SHA256:AES256-SHA256:AES128-SHA256:AES256-SHA:AES128-SHA:DES-CBC3-SHA:HIGH:!aNULL:!eNULL:!EXPORT:!DES:!MD5:!PSK:!RC4";
	ssl_prefer_server_ciphers on;
	ssl_session_cache shared:SSL:50m;

	# https://raymii.org/s/tutorials/Strong_SSL_Security_On_nginx.html#Forward_Secrecy_&_Diffie_Hellman_Ephemeral_Parameters
	ssl_dhparam /etc/ssl/certs/dhparam.pem;

	add_header Strict-Transport-Security "max-age=31536000; includeSubdomains";


	# An older approach to serve /index.html statically (for performance?)
	#location = / {
	#	index index.html;
	#	root /var/www/sites/amagama/amagama/amagama/templates/;
	#}
	#location = /index.html {
	#	root /var/www/sites/amagama/amagama/amagama/templates/;
	#}
#
	
	location /static {
                gzip on;
                gzip_types text/css application/javascript;
		root /var/www/sites/amagama_fw/amagama/amagama;
	}

	###location / { try_files $uri @amagama; }
	###location @amagama {
	location /api/v1/  { try_files $uri @amagama; }
        location /tmserver/ { try_files $uri @amagama; }
        location = / { try_files $uri @amagama; }
        location @amagama {
		include uwsgi_params;
		###uwsgi_pass unix:/var/www/sites/amagama/uwsgi.sock;
		#uwsgi_pass unix:/run/amagama-web/uwsgi.socket;
		uwsgi_pass unix:/run/amagama/uwsgi.socket;

                if ($request_method = 'OPTIONS') {
                    add_header 'Access-Control-Allow-Origin' '*';
                    #
                    # Om nom nom cookies
                    #
                    add_header 'Access-Control-Allow-Credentials' 'true';
                    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                    #
                    # Custom headers and headers various browsers *should* be OK with but aren't
                    #
                    add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
                    #
                    # Tell client that this pre-flight info is valid for 20 days
                    #
                    add_header 'Access-Control-Max-Age' 1728000;
                    add_header 'Content-Type' 'text/plain charset=UTF-8';
                    add_header 'Content-Length' 0;
                    return 204;
                 }
                 if ($request_method = 'POST') {
                    add_header 'Access-Control-Allow-Origin' '*';
                    add_header 'Access-Control-Allow-Credentials' 'true';
                    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                    add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
                 }
                 if ($request_method = 'GET') {
                    add_header 'Access-Control-Allow-Origin' '*';
                    add_header 'Access-Control-Allow-Credentials' 'true';
                    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                    add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
                 }

	}
}

