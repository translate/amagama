[[block]]
name = "vscode"
title = "Visual Studio Code"
source = "vscode"
# A pseudo-locale for testing, not a translation.
languages.qps-ploc = ""
licence = "MIT"

# Unicode CLDR's names of languages, scripts and regions, and Gregorian dates
# (months, days, eras). Each id names its file's locale (main.de....), so the
# English is matched with that segment left out. Regional locales hold only
# what differs from their language.
[[block]]
name = "cldr-names-{version}"
title = "CLDR names"
source = "git"
url = "https://github.com/unicode-org/cldr-json"
ref = "{version}.0.0"
files = ["cldr-json/cldr-localenames-full/main/{lang}/*.json"]
format = "json"
template = "cldr-json/cldr-localenames-full/main/en/*.json"
language_in_ids = true
exclude_ids = ["main.*.identity.*"]
# Polytonic Greek isn't modern Greek; English for the world and Europe
# aren't regions amaGama keeps.
languages.el-polyton = ""
languages.en-001 = ""
languages.en-150 = ""
licence = "Unicode-3.0"
versions = ["49"]

[[block]]
name = "cldr-dates-{version}"
title = "CLDR dates"
source = "git"
url = "https://github.com/unicode-org/cldr-json"
ref = "{version}.0.0"
files = ["cldr-json/cldr-dates-full/main/{lang}/ca-gregorian.json"]
format = "json"
template = "cldr-json/cldr-dates-full/main/en/ca-gregorian.json"
language_in_ids = true
exclude_ids = ["main.*.identity.*"]
languages.el-polyton = ""
languages.en-001 = ""
languages.en-150 = ""
licence = "Unicode-3.0"
versions = ["49"]

[[block]]
name = "microsoft-ui-strings"
title = "Microsoft UI strings"
disabled = "Microsoft's notice in each file forbids entering the glossaries into a storage or retrieval system without its consent"
source = "git"
min_age_days = 30
# Microsoft's 2020 Translation and UI Strings Glossaries as termic commits
# them, for 12 languages; Microsoft's own download needs a login. About 2% of
# rows misquote a field (""text"" for """text"""), so a comma in it splits the
# row and its translation comes in misaligned: fix before enabling.
url = "https://github.com/Spidersouris/termic-data"
files = ["csv_to_merge/{lang}/*.csv"]
format = "csv"
columns = ["source", "", "target"]
header_row = "Source Term"
languages.es-LATAM = "es_419"
