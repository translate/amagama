# Generated by: amagama-manage discover_sources crowdin --forge gitlab --prefix gitlab-crowdin --min-stars 25 --min-units 100 --min-age-days 60 --weight 0.8 --tag discovered
# Review before use: drop what amaGama shouldn't import.

[defaults]
source = "git"
min_age_days = 60
weight = 0.8
tags = ["discovered"]

[[block]]
name = "gitlab-crowdin-CraftPresence-en_us"
title = "CraftPresence"
url = "https://gitlab.com/CDAGaming/CraftPresence"
files = ["common/src/main/resources/assets/**/lang/{lang}.json"]
sparse = ["common/src/main/resources/assets/**/lang/*.json", "common/src/main/resources/assets/**/lang/en_us.json"]
format = "json"
template = "common/src/main/resources/assets/**/lang/en_us.json"
licence = "MIT"

[[block]]
name = "gitlab-crowdin-bitcoin-cash-node"
title = "bitcoin-cash-node"
url = "https://gitlab.com/bitcoin-cash-node/bitcoin-cash-node"
files = ["src/qt/locale/bitcoin_{lang}.ts"]
exclude = ["src/qt/locale/bitcoin_en.ts"]
sparse = ["src/qt/locale/bitcoin_*.ts"]
format = "ts"
licence = "MIT"

[[block]]
name = "gitlab-crowdin-duplicity"
disabled = "duplicates gitlab-linguas-duplicity"
title = "duplicity"
url = "https://gitlab.com/duplicity/duplicity"
files = ["po/{lang}.po"]
sparse = ["po/*.po"]
licence = "GPL-2.0-or-later"

[[block]]
name = "gitlab-crowdin-filelink-nextcloud-messages"
title = "filelink-nextcloud"
url = "https://gitlab.com/joendres/filelink-nextcloud"
files = ["src/_locales/{lang}/messages.json"]
sparse = ["src/_locales/*/messages.json", "src/_locales/en/messages.json"]
format = "webextension"
template = "src/_locales/en/messages.json"
licence = "MIT"

[[block]]
name = "gitlab-crowdin-fvtt-cyberpunk-red-core-babele"
title = "fvtt-cyberpunk-red-core"
url = "https://gitlab.com/cyberpunk-red-team/fvtt-cyberpunk-red-core"
files = ["src/babele/{lang}/*.json"]
sparse = ["src/babele/*/*.json", "src/babele/en/*.json"]
format = "json"
template = "src/babele/en/*.json"
licence = "GPL-3.0-only"

[[block]]
name = "gitlab-crowdin-fvtt-cyberpunk-red-core-en"
title = "fvtt-cyberpunk-red-core"
url = "https://gitlab.com/cyberpunk-red-team/fvtt-cyberpunk-red-core"
files = ["src/lang/{lang}.json"]
sparse = ["src/lang/*.json", "src/lang/en.json"]
format = "json"
template = "src/lang/en.json"
licence = "GPL-3.0-only"

[[block]]
name = "gitlab-crowdin-gnome-shell-extension-task-widget"
title = "gnome-shell-extension-task-widget"
url = "https://gitlab.com/jmiskinis/gnome-shell-extension-task-widget"
files = ["data/po/{lang}.po"]
sparse = ["data/po/*.po"]
languages = {"sv" = "sv_SE"}
licence = "GPL-2.0-or-later"

[[block]]
name = "gitlab-crowdin-revanced-patches-strings"
title = "revanced-patches"
url = "https://gitlab.com/ReVanced/revanced-patches"
files = ["patches/src/main/resources/addresources/values-{lang}/strings.xml"]
sparse = ["patches/src/main/resources/addresources/values-*/strings.xml", "patches/src/main/resources/addresources/values/strings.xml"]
format = "android"
template = "patches/src/main/resources/addresources/values/strings.xml"
licence = "GPL-3.0-or-later"

[[block]]
name = "gitlab-crowdin-screenrecorder-strings"
title = "screenrecorder"
url = "https://gitlab.com/vijai/screenrecorder"
files = ["app/src/fdroid/res/values-{lang}/strings.xml"]
sparse = ["app/src/fdroid/res/values-*/strings.xml", "app/src/fdroid/res/values/strings.xml"]
format = "android"
template = "app/src/fdroid/res/values/strings.xml"
licence = "AGPL-3.0-only"

[[block]]
name = "gitlab-crowdin-screenrecorder-strings-2"
title = "screenrecorder"
url = "https://gitlab.com/vijai/screenrecorder"
files = ["app/src/main/res/values-{lang}/strings.xml"]
sparse = ["app/src/main/res/values-*/strings.xml", "app/src/main/res/values/strings.xml"]
format = "android"
template = "app/src/main/res/values/strings.xml"
licence = "AGPL-3.0-only"

[[block]]
name = "gitlab-crowdin-screenrecorder-strings-3"
title = "screenrecorder"
url = "https://gitlab.com/vijai/screenrecorder"
files = ["app/src/playstore/res/values-{lang}/strings.xml"]
sparse = ["app/src/playstore/res/values-*/strings.xml", "app/src/playstore/res/values/strings.xml"]
format = "android"
template = "app/src/playstore/res/values/strings.xml"
licence = "AGPL-3.0-only"

[[block]]
name = "gitlab-crowdin-website-layout"
title = "website"
url = "https://gitlab.com/thenewoil/website"
files = ["src/assets/data/layout/{lang}/**/*.json"]
sparse = ["src/assets/data/layout/*/**/*.json", "src/assets/data/layout/en/**/*.json"]
format = "json"
template = "src/assets/data/layout/en/**/*.json"
licence = "CC-BY-4.0"
