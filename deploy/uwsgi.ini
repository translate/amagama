[uwsgi]
plugins=python3
chdir=/var/www/sites/amagama_fw/amagama
home=/var/www/sites/amagama_fw/env3
env=AMAGAMA_CONFIG=/var/www/sites/amagama_fw/local_settings.py
module=wsgi:application
logto=/var/www/sites/amagama_fw/logs/uwsgi.log
master=true
lazy-apps=true
processes=2
threads=4
stats=127.0.0.1:9191
memory-report=true
procname-prefix=amagama fw::
