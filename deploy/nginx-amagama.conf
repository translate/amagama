# The combined format plus the Sec-Purpose header, which tells ordinary
# lookups from prefetches ("prefetch") and bulk fetches ("prefetch;bulk").
log_format amagama '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                   '"$http_sec_purpose"';

# Bulk requests: Sec-Purpose has a prefetch item with a true bulk parameter
# (RFC 8941 list), limited apart from other lookups.
map $http_sec_purpose $amagama_bulk {
	default "";
	'~*(^|,)\s*prefetch(\s*;\s*[a-z0-9_.*-]+(=("[^"]*"|[^;,]*))?)*\s*;\s*bulk(=[?]1)?\s*(;|,|$)' 1;
}
map $amagama_bulk $amagama_bulk_client {
	default "";
	1 $binary_remote_addr;
}
# An empty key isn't limited.
limit_req_zone $amagama_bulk_client zone=amagama_bulk_client:1m rate=1r/s;
limit_req_zone $amagama_bulk zone=amagama_bulk_all:64k rate=2r/s;

# Other API lookups (ordinary ones and plain prefetches), per client. A
# translator in Virtaal sends one per unit plus up to two ahead; the burst
# (in each location below) covers skimming through a file. Reads only: the
# write API's POST and PUT share these paths.
map "$amagama_bulk:$request_method:$uri" $amagama_lookup_client {
	default "";
	"~^:(GET|HEAD):/(api/|tmserver(/|$))" $binary_remote_addr;
}
limit_req_zone $amagama_lookup_client zone=amagama_lookup_client:10m rate=5r/s;

map $status $amagama_retry_after {
	default "";
	429 30;
}

# Redirect everything to https
server {
	server_name amagama-live.translatehouse.org;
	listen 80;
	listen [::]:80 ipv6only=on;

	return 301 https://$server_name$request_uri;
}

# Backwards compatibility
# Redirect amagama.locamotion.org to amagama-live.translatehouse.org

server {
	server_name amagama.locamotion.org;
	listen 80;
	listen [::]:80;

	access_log /srv/amagama/logs/nginx.access.log amagama;
	error_log /srv/amagama/logs/nginx.error.log;
	location / {
		return 301 https://amagama-live.translatehouse.org;
	}

	location /tmserver {
		include uwsgi_params;
		uwsgi_pass unix:/run/amagama/uwsgi.socket;
		limit_req zone=amagama_bulk_client burst=5;
		limit_req zone=amagama_bulk_all burst=10;
		limit_req zone=amagama_lookup_client burst=50 nodelay;
		limit_req_status 429;
		limit_req_log_level info;
		add_header Retry-After $amagama_retry_after always;
	#	rewrite ^/tmserver/(.*)$ https://amagama-live.translatehouse.org/api/v1/$1 permanent;
	}
}

server {
	server_name amagama-live.translatehouse.org;
	listen 443 ssl;
	listen [::]:443 ssl default_server;
	http2 on;

	charset utf-8;
	root /srv/amagama/amagama/amagama;
	access_log /srv/amagama/logs/live-nginx.access.log amagama;
	error_log /srv/amagama/logs/live-nginx.error.log;

	ssl_certificate /etc/letsencrypt/live/amagama-live.translatehouse.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/amagama-live.translatehouse.org/privkey.pem;
	ssl_session_timeout 1d;
	ssl_session_cache shared:SSL:10m;
	ssl_session_tickets off;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
	ssl_prefer_server_ciphers off;

	# https://raymii.org/s/tutorials/Strong_SSL_Security_On_nginx.html#Forward_Secrecy_&_Diffie_Hellman_Ephemeral_Parameters
	ssl_dhparam /etc/ssl/certs/dhparam.pem;

	add_header Strict-Transport-Security "max-age=31536000; includeSubdomains" always;

	location /static {
                gzip on;
                gzip_types text/css application/javascript;
		root /srv/amagama/amagama/amagama;
	}

	location = /favicon.ico { try_files /static/favicon.ico =404; }

	location /api/v1/  { try_files $uri @amagama; }
        location /tmserver/ { try_files $uri @amagama; }
        location = / { try_files $uri @amagama; }
        location = /stats/ { try_files $uri @amagama; }
        location @amagama {
		include uwsgi_params;
		uwsgi_pass unix:/run/amagama/uwsgi.socket;
		limit_req zone=amagama_bulk_client burst=5;
		limit_req zone=amagama_bulk_all burst=10;
		limit_req zone=amagama_lookup_client burst=50 nodelay;
		limit_req_status 429;
		limit_req_log_level info;

		add_header Retry-After $amagama_retry_after always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubdomains" always;
		add_header Access-Control-Allow-Origin * always;
		add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
		add_header Access-Control-Allow-Headers "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type" always;
		add_header Access-Control-Max-Age 1728000 always;

		if ($request_method = OPTIONS) {
			return 204;
		}

	}
}
