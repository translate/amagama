# MediaWiki's extensions and skins bundled in its release tarballs (the
# extensions/ and skins/ submodules of each core release branch), on the
# releases the mediawiki-{version} block imports. Chosen by hand.

[defaults]
source = "git"
min_age_days = 7
tags = ["core"]
files = ["**/i18n/**/{lang}.json"]
exclude = ["**/i18n/**/qqq.json"]
format = "json"
template = "**/i18n/**/en.json"
exclude_ids = ["@metadata*"]
# As the mediawiki-{version} block.
languages.de-formal = "de"
languages.es-formal = "es"
languages.hu-formal = "hu"
languages.nl-informal = "nl"
languages.kk-cyrl = "kk"
languages.mo = "ro"
languages.nan-latn-tailo = "nan@latin"
languages.sr-ec = "sr"
languages.sr-el = "sr@latin"

[[block]]
name = "mediawiki-abusefilter-{version}"
title = "MediaWiki AbuseFilter"
url = "https://github.com/wikimedia/mediawiki-extensions-AbuseFilter"
licence = "GPL-2.0-or-later"
versions = [
  { version = "1.43", ref = "REL1_43" },
  { version = "1.45", ref = "REL1_45" },
  { version = "1.46", ref = "REL1_46" },
]

