# Blocks of translations amaGama imports. See docs/sources.rst.
# A block's name identifies its imports: never rename or reuse one. Titles
# will be translated; keep release numbers in version.

[[block]]
name = "legacy-2019"
title = "Legacy OSS"
source = "snapshot"
snapshot = "legacy"

[[block]]
name = "gnome-{version}"
title = "GNOME"
source = "damned-lies"
release = "gnome-{version}"
versions = ["44", "45", "46", "47", "48", "49", "50", "51"]

[[block]]
name = "gnome-help-{version}"
title = "GNOME Help"
source = "damned-lies"
release = "gnome-{version}"
tarballs = ["doc"]
segment = true
versions = ["44", "45", "46", "47", "48", "49", "50", "51"]

[[block]]
name = "kde"
title = "KDE"
source = "svn"
url = "svn://anonsvn.kde.org/home/kde/trunk/l10n-kf6"
dirs = ["messages"]
# Paced: KDE's anonymous svn is shared.
pause = 1.5

[[block]]
name = "debian"
title = "Debian"
source = "http"
base_url = "https://i18n.debian.org/compendia/"
path = "{lang}/compendium-{lang}-LATEST.po"
# LATEST is missing when msgcat raised no error (Wolof).
fallback = "{lang}/pre-compendium-{lang}-stamp*.po"

[[block]]
name = "translationproject"
title = "Translation Project"
source = "translationproject"

[[block]]
name = "libreoffice-{version}"
title = "LibreOffice"
source = "git"
url = "https://git.libreoffice.org/translations"
files = ["source/{lang}/**/*.po"]
exclude = ["source/*/helpcontent2/**"]
licence = "MPL-2.0"
versions = [
  { version = "24.2", ref = "libreoffice-24-2" },
  { version = "24.8", ref = "libreoffice-24-8" },
  { version = "25.2", ref = "libreoffice-25-2" },
  { version = "25.8", ref = "libreoffice-25-8" },
  { version = "26.2", ref = "libreoffice-26-2" },
  { version = "26.8", ref = "libreoffice-26-8" },
]

[[block]]
name = "libreoffice-help-{version}"
title = "LibreOffice Help"
source = "git"
url = "https://git.libreoffice.org/translations"
files = ["source/{lang}/helpcontent2/**/*.po"]
segment = true
licence = "MPL-2.0"
versions = [
  { version = "26.2", ref = "libreoffice-26-2" },
  { version = "26.8", ref = "libreoffice-26-8" },
]

[[block]]
name = "django-{version}"
title = "Django"
source = "git"
url = "https://github.com/django/django"
ref = "stable/{version}.x"
files = ["django/conf/locale/{lang}/LC_MESSAGES/*.po",
         "django/contrib/*/locale/{lang}/LC_MESSAGES/*.po"]
languages = { en = "" }
licence = "BSD-3-Clause"
versions = ["5.2", "6.0", "6.1"]

[[block]]
name = "odoo-{version}"
title = "Odoo"
source = "git"
url = "https://github.com/odoo/odoo"
ref = "{version}.0"
files = ["addons/*/i18n/{lang}.po", "odoo/addons/*/i18n/{lang}.po"]
licence = "LGPL-3.0-only"
versions = ["19", "20"]

[[block]]
name = "qt-{version}"
title = "Qt"
source = "git"
url = "https://github.com/qt/qttranslations"
ref = "{version}"
files = ["translations/*_{lang}.ts"]
# The open licences the .ts files are offered under (also Qt commercial).
licence = "LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only"
versions = ["6.8", "6.11", "6.12"]

[[block]]
name = "nextcloud-{version}"
title = "Nextcloud"
source = "git"
url = "https://github.com/nextcloud/server"
ref = "stable{version}"
files = ["core/l10n/{lang}.json", "lib/l10n/{lang}.json", "apps/*/l10n/{lang}.json"]
format = "nextcloud-json"
licence = "AGPL-3.0-only OR AGPL-3.0-or-later"
versions = ["34", "35"]

[[block]]
name = "mediawiki-{version}"
title = "MediaWiki"
source = "git"
url = "https://github.com/wikimedia/mediawiki"
files = ["languages/i18n/{lang}.json"]
exclude = ["languages/i18n/qqq.json"]
format = "json"
template = "languages/i18n/en.json"
exclude_ids = ["@metadata*"]
# Accepted merges: register variants, an old code, two romanisations.
languages.de-formal = "de"
languages.es-formal = "es"
languages.hu-formal = "hu"
languages.nl-informal = "nl"
languages.kk-cyrl = "kk"
languages.mo = "ro"
languages.nan-latn-tailo = "nan@latin"
licence = "GPL-2.0-or-later"
versions = [
  { version = "1.43", ref = "REL1_43" },
  { version = "1.45", ref = "REL1_45" },
  { version = "1.46", ref = "REL1_46" },
]

