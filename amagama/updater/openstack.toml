# OpenStack's dashboard (Horizon) and its plugins, from opendev.org: the
# repositories that commit their translations, on the maintained stable
# releases. Chosen by hand.

[defaults]
source = "git"
min_age_days = 7
tags = ["core"]
ref = "stable/{version}"
# Each Python package's catalogs; not doc/ or releasenotes/.
files = ["*/locale/{lang}/LC_MESSAGES/*.po"]
# Regions the codes always add.
languages.fi_FI = "fi"
languages.ka_GE = "ka"
languages.ko_KR = "ko"
languages.nl_NL = "nl"
languages.pl_PL = "pl"
languages.sl_SI = "sl"
languages.tr_TR = "tr"
licence = "Apache-2.0"

[[block]]
name = "openstack-horizon-{version}"
title = "OpenStack Dashboard"
url = "https://opendev.org/openstack/horizon"
versions = ["2025.2", "2026.1", "2026.2"]

