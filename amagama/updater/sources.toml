# Blocks of translations amaGama imports. See docs/sources.rst.
# A block's name identifies its imports: never rename or reuse one. Titles
# will be translated; keep release numbers in version.
# Git blocks have min_age_days = 7: the database is rebuilt weekly, so
# there's no use fetching a moving branch more often.

# Blocks written by weblate_sources and discover_sources.
include = ["weblate-fedora.toml", "weblate-hosted.toml", "linguas-github.toml",
           "transifex-github.toml", "crowdin-github.toml", "l10n-toml-github.toml"]

# The blocks here are chosen by hand.
[defaults]
tags = ["core"]

